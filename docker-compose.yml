# Sobe o PostgreSQL 16 e a API. Lê as variáveis do arquivo .env (copie de .env.example).
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-predictspin}
      POSTGRES_USER: ${DB_USER:-predictspin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Dentro da rede do compose o banco responde pelo nome do serviço
      DB_HOST: db
      DB_PORT: "5432"
      PORT: "8080"
      # vazio = limites normais; "tempos-curtos" só para o Playwright do fluxo de alarme
      SPRING_PROFILES_ACTIVE: ${PERFIL_API:-}
      # barra de demonstração (docs/demo.md): desligada por padrão; ligue com PS_DEMO_HABILITADO=true
      PS_DEMO_HABILITADO: ${PS_DEMO_HABILITADO:-false}
      PS_DEMO_JANELA_S: ${PS_DEMO_JANELA_S:-5}
      # serviço de treino (perfil "treino"): defina TREINO_URL=http://treino:8090 e TREINO_CHAVE no .env
      TREINO_URL: ${TREINO_URL:-}
    ports:
      - "8080:8080"

  # Serviço de treino (FastAPI): só sobe com --profile treino. Busca o conjunto na API e devolve o modelo.
  #   docker compose --profile treino up -d --build
  treino:
    profiles: ["treino"]
    build:
      context: ./analise
      dockerfile: treino/Dockerfile
    restart: unless-stopped
    environment:
      PS_API_URL: http://api:8080
      TREINO_CHAVE: ${TREINO_CHAVE:?defina TREINO_CHAVE no .env}
    ports:
      - "8090:8090"

volumes:
  dados-postgres:
