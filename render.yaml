# Blueprint do Render: API em Docker (pasta api/), banco PostgreSQL gerenciado e o painel web como
# site estático (pasta painel/).
# Passo a passo em docs/deploy-render.md.
#
# Nenhum segredo fica neste arquivo. As variáveis com "sync: false" são pedidas pelo Render
# na criação do Blueprint e ficam guardadas só lá.

databases:
  - name: predictspin-db
    plan: free
    region: virginia
    databaseName: predictspin
    user: predictspin
    postgresMajorVersion: "16"

services:
  - type: web
    name: predictspin-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    # Só reconstrói quando a API muda
    buildFilter:
      paths:
        - api/**
        - render.yaml
    healthCheckPath: /actuator/health
    # PORT não é declarada: o Render injeta a porta e a API escuta nela (server.port=${PORT}).
    envVars:
      # --- Banco: o Render preenche com a conexão interna do banco acima.
      # A API converte DATABASE_URL (postgresql://usuario:senha@host/banco) para JDBC.
      - key: DATABASE_URL
        fromDatabase:
          name: predictspin-db
          property: connectionString
      - key: DB_POOL_MAX
        value: "5"

      # --- JVM: limites para a instância de 512 MB ---
      - key: JAVA_OPTS
        value: >-
          -Xmx220m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=96m
          -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError

      - key: ADMIN_NOME
        value: Administrador

      # --- Segredos e dados de instalação: sem valor aqui, informados no painel do Render ---
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
      - key: DEVICE_CREDENTIAL_SALT
        sync: false
      - key: DISPOSITIVO_TORNO_CHAVE
        sync: false
      - key: DISPOSITIVO_SIM_CHAVE
        sync: false
      - key: CORS_ORIGENS
        sync: false

  # --- Painel web: site estático (build do Vite), servido pela CDN do Render ---
  # Sem plano nem região: site estático não tem (o esquema do Blueprint recusa os dois campos).
  - type: web
    name: predictspin-painel
    runtime: static
    # caminhos relativos à raiz do repositório
    buildCommand: cd painel && npm ci && npm run build
    staticPublishPath: ./painel/dist
    # Só reconstrói quando o painel muda
    buildFilter:
      paths:
        - painel/**
    # SPA: toda rota volta para o index.html (o roteador do painel resolve no navegador)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      # arquivos com hash no nome nunca mudam: cache longo e imutável
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # o index.html aponta para os arquivos novos a cada publicação: sempre conferido
      - path: /index.html
        name: Cache-Control
        value: no-cache
    # A Content-Security-Policy vai numa <meta> gerada no build (vite.config.ts), porque o endereço
    # da API vem de VITE_API_URL e o render.yaml não monta cabeçalho a partir de variável.
    envVars:
      # endereço da API publicada (https://...onrender.com), sem barra no fim; lido no build
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        value: "24"
