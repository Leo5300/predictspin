spring:
  application:
    name: predictspin-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:predictspin}
    username: ${DB_USER:predictspin}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      # resultado do treino: até 3 arquivos de modelo de ps.modelo.tamanho-max-mb (5 MB) mais os metadados
      max-file-size: 6MB
      max-request-size: 20MB
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Atrás do proxy do Render: usa X-Forwarded-For para obter o IP real (limite de login por IP)
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

predictspin:
  seguranca:
    jwt:
      segredo: ${JWT_SECRET:}
      validade-ms: ${JWT_EXPIRATION_MS:86400000}
    cors-origens: ${CORS_ORIGENS:http://localhost:3000,http://localhost:5173}
    login:
      max-tentativas-email: ${LOGIN_MAX_TENTATIVAS_EMAIL:5}
      max-tentativas-ip: ${LOGIN_MAX_TENTATIVAS_IP:20}
      janela-segundos: ${LOGIN_JANELA_SEGUNDOS:900}
    dispositivo-sal: ${DEVICE_CREDENTIAL_SALT:}
  # Eventos ao vivo (SSE): limites pensados para a instância de 0,1 CPU e 512 MB
  eventos:
    max-por-usuario: ${EVENTOS_MAX_POR_USUARIO:4}
    max-total: ${EVENTOS_MAX_TOTAL:20}
    batimento: 15s
    fila-por-assinante: 64
    # no máximo um evento "recuperacao" (janelas antigas reenviadas) por máquina a cada 5 s
    intervalo-recuperacao: 5s
    duracao-maxima: 30m
  carga-inicial:
    maquina-codigo: TORNO-01
    admin-nome: ${ADMIN_NOME:Administrador}
    admin-email: ${ADMIN_EMAIL:}
    admin-senha: ${ADMIN_SENHA:}
    dispositivo-real: ps-torno-01
    chave-dispositivo-real: ${DISPOSITIVO_TORNO_CHAVE:}
    dispositivo-simulado: ps-sim-01
    chave-dispositivo-simulado: ${DISPOSITIVO_SIM_CHAVE:}

# Referência, alarme e OS: todos os números são PROPOSTA a confirmar com dado real (docs/alarmes.md).
# A rota GET /api/v1/alarmes/limites os serve ao painel; o painel nunca os escreve à mão.
ps:
  referencia:
    # célula com menos janelas fica "insuficiente" e não gera z (24 janelas = 2 min a 5 s)
    min-janelas: 24
    # piso do σ efetivo como fração da mediana
    sigma-min-fracao: 0.05
    # rotação fora de ±10% da marcha mais próxima torna a janela ruim
    tolerancia-marcha: 0.10
    # janela com menos de 98% das amostras esperadas é ruim
    amostras-min-fracao: 0.98
    deriva:
      habilitada: true
      dias: 7
      fracao-maxima: 0.30
  alarme:
    # ATENÇÃO com z ≥ 3, ALARME com z ≥ 5 (z = quantos σ efetivos acima da mediana da referência)
    z-atencao: 3
    z-alarme: 5
    # ISA-18.2: entra só depois de 15 s seguidos acima do limite...
    atraso-s: 15
    # ...e sai só com z abaixo de (limite − 1) por 15 s
    histerese-z: 1
    saida-s: 15
    # alerta de instrumento: ponto ausente ou sinal sumido por 30 s
    instrumento-s: 30
    # "sinal sumido": RMS e 1X abaixo de 50% do típico
    sinal-fracao: 0.5
    # de quanto em quanto tempo a API confere supressões vencidas
    verificar-supressao: 30s
    # indicadores do Diagnóstico: período, intervalo da pior rajada e dos repetitivos (mesmo alerta aberto
    # ou reaberto 3 vezes no intervalo), e alerta ativo há mais de 24 h = parado
    indicadores-h: 24
    rajada-min: 10
    repetitivo-vezes: 3
    parado-h: 24
    # prazos de supressão oferecidos no painel e o maior aceito pela API (uma semana)
    supressao-opcoes-min: [15, 60, 240, 1440]
    supressao-max-min: 10080
  avaliacao:
    # a avaliação de cada janela roda depois da resposta, numa fila por máquina e tipo de dado (uma thread):
    # até 64 janelas esperando; cheia, o POST espera até 2000 ms por vaga e depois grava sem avaliar (contado)
    fila-max: 64
    espera-fila-ms: 2000
  os:
    # alerta de máquina em ALARME por 120 s seguidos abre OS
    alarme-continuo-s: 120
    # ou severidade acumulada do ponto acima de 600 z·s desde a última OS (≈ 5 min com z = 5)
    severidade-limite: 600
  push:
    # notificação de alarme pelo serviço de push do Expo (docs/app-push.md); desligada por padrão
    habilitado: ${PUSH_HABILITADO:false}
    url: https://exp.host/--/api/v2/push/send
    # opcional ("segurança de push" ligada no painel do Expo); segredo: nunca no repositório
    token-acesso: ${EXPO_ACCESS_TOKEN:}
    # cada chamada ao Expo espera no máximo 5 s, com no máximo uma nova tentativa
    timeout-ms: 5000
    # no máximo um push por ponto e tipo (alarme, os, instrumento) a cada 15 min
    intervalo-min: ${PUSH_INTERVALO_MIN:15}
    fila-max: 200
    lote: 100
    max-aparelhos: 10

  # Barra de demonstração (docs/demo.md): a API gera janelas SIMULADAS no ps-sim-01 para a apresentação.
  # Desligada por padrão: só o ambiente da apresentação liga (PS_DEMO_HABILITADO=true). Sem a variável, as rotas
  # /api/v1/demo respondem 404 e nenhuma janela é gerada.
  demo:
    habilitado: ${PS_DEMO_HABILITADO:false}
    # intervalo entre as janelas geradas (s); o padrão é o da janela real
    janela-s: ${PS_DEMO_JANELA_S:5}
    # ATENÇÃO e ALARME voltam sozinhos a NORMAL depois disto (s)
    volta-normal-s: ${PS_DEMO_VOLTA_NORMAL_S:300}
    # o gerador para sozinho depois disto (min) sem um novo comando
    parar-min: ${PS_DEMO_PARAR_MIN:20}
    # marcha da demonstração: precisa ter referência ativa (T1 e T3) simulada
    rotacao-rpm: 1120
    dispositivo: ps-sim-01

  # ---------------------------------------------------------------- IA parte B (docs/ia.md)
  # Todos os números são PROPOSTA a confirmar com os ensaios rotulados no torno.
  modelo:
    # limiar do Isolation Forest: percentil 99 do escore nas janelas normais do treino
    if-percentil: 99
    # abaixo de 60% de confiança o painel mostra "classe incerta"
    confianca-min: 0.6
    # tamanho máximo de cada arquivo de modelo aceito (MB)
    tamanho-max-mb: 5
    # parâmetros fixos do treino (modelo pequeno e reprodutível)
    arvores-if: 100
    arvores-rf: 60
    profundidade-max-rf: 10
    semente: 42
    # características citadas na explicação de cada janela
    explicacao-top: 3
  treino:
    # endereço do serviço de treino; vazio = o trabalho mostra o comando para rodar no notebook
    url: ${TREINO_URL:}
    # segredo compartilhado com o serviço de treino (cabeçalho X-Treino-Chave); nunca no repositório
    chave: ${TREINO_CHAVE:}
    # o serviço gratuito dorme: a API espera até 180 s ele acordar
    espera-acordar-s: 180
    # trabalho executando há mais de 30 min vira "falhou"
    prazo-execucao-min: 30
    # o retorno do técnico na OS vira rótulo do próximo treino
    usar-retorno-os: true
    # classe com menos de 2 ensaios fica fora do classificador; validação por ensaio com até 5 partes
    min-ensaios-por-classe: 2
    k-max: 5
    fuso: America/Sao_Paulo
    pagina-max: 1000
  fusao:
    # canais lentos no vetor de características: todos DESABILITADOS até a próxima fase
    canais:
      temp_cabecote_c:
        habilitado: false
      temp_ferramenta_c:
        habilitado: false
      nivel_som_db:
        habilitado: false
      corrente_a:
        habilitado: false
      amb_temp_c:
        habilitado: false
      amb_umid_pct:
        habilitado: false
  tendencia:
    # prognóstico por tendência: pronto e DESABILITADO
    habilitada: false
    min-dias: 7
    janela-dias: 60
    # limites de cada série (por dia): severidade acumulada (z·s), deriva (mediana do z do RMS no dia, σ) e
    # temperatura do cabeçote (°C, média do dia; só com o canal habilitado na fusão)
    limite-severidade: 600
    limite-deriva-z: 3
    limite-temp-cabecote-c: 60

springdoc:
  # As respostas são JSON; sem isto o documento diz "*/*" e o cliente gerado perde o tipo
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha
