spring:
  application:
    name: predictspin-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:predictspin}
    username: ${DB_USER:predictspin}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Atrás do proxy do Render: usa X-Forwarded-For para obter o IP real (limite de login por IP)
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

predictspin:
  seguranca:
    jwt:
      segredo: ${JWT_SECRET:}
      validade-ms: ${JWT_EXPIRATION_MS:86400000}
    cors-origens: ${CORS_ORIGENS:http://localhost:3000,http://localhost:5173}
    login:
      max-tentativas-email: ${LOGIN_MAX_TENTATIVAS_EMAIL:5}
      max-tentativas-ip: ${LOGIN_MAX_TENTATIVAS_IP:20}
      janela-segundos: ${LOGIN_JANELA_SEGUNDOS:900}
    dispositivo-sal: ${DEVICE_CREDENTIAL_SALT:}
  # Eventos ao vivo (SSE): limites pensados para a instância de 0,1 CPU e 512 MB
  eventos:
    max-por-usuario: ${EVENTOS_MAX_POR_USUARIO:4}
    max-total: ${EVENTOS_MAX_TOTAL:20}
    batimento: 15s
    fila-por-assinante: 64
    # no máximo um evento "recuperacao" (janelas antigas reenviadas) por máquina a cada 5 s
    intervalo-recuperacao: 5s
    duracao-maxima: 30m
  carga-inicial:
    maquina-codigo: TORNO-01
    admin-nome: ${ADMIN_NOME:Administrador}
    admin-email: ${ADMIN_EMAIL:}
    admin-senha: ${ADMIN_SENHA:}
    dispositivo-real: ps-torno-01
    chave-dispositivo-real: ${DISPOSITIVO_TORNO_CHAVE:}
    dispositivo-simulado: ps-sim-01
    chave-dispositivo-simulado: ${DISPOSITIVO_SIM_CHAVE:}

# Referência, alarme e OS: todos os números são PROPOSTA a confirmar com dado real (docs/alarmes.md).
# A rota GET /api/v1/alarmes/limites os serve ao painel; o painel nunca os escreve à mão.
ps:
  referencia:
    # célula com menos janelas fica "insuficiente" e não gera z (24 janelas = 2 min a 5 s)
    min-janelas: 24
    # piso do σ efetivo como fração da mediana
    sigma-min-fracao: 0.05
    # rotação fora de ±10% da marcha mais próxima torna a janela ruim
    tolerancia-marcha: 0.10
    # janela com menos de 98% das amostras esperadas é ruim
    amostras-min-fracao: 0.98
    deriva:
      habilitada: true
      dias: 7
      fracao-maxima: 0.30
  alarme:
    # ATENÇÃO com z ≥ 3, ALARME com z ≥ 5 (z = quantos σ efetivos acima da mediana da referência)
    z-atencao: 3
    z-alarme: 5
    # ISA-18.2: entra só depois de 15 s seguidos acima do limite...
    atraso-s: 15
    # ...e sai só com z abaixo de (limite − 1) por 15 s
    histerese-z: 1
    saida-s: 15
    # alerta de instrumento: ponto ausente ou sinal sumido por 30 s
    instrumento-s: 30
    # "sinal sumido": RMS e 1X abaixo de 50% do típico
    sinal-fracao: 0.5

springdoc:
  # As respostas são JSON; sem isto o documento diz "*/*" e o cliente gerado perde o tipo
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha
