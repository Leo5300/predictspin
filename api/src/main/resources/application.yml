spring:
  application:
    name: predictspin-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:predictspin}
    username: ${DB_USER:predictspin}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Atrás do proxy do Render: usa X-Forwarded-For para obter o IP real (limite de login por IP)
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

predictspin:
  seguranca:
    jwt:
      segredo: ${JWT_SECRET:}
      validade-ms: ${JWT_EXPIRATION_MS:86400000}
    cors-origens: ${CORS_ORIGENS:http://localhost:3000}
    login:
      max-tentativas-email: ${LOGIN_MAX_TENTATIVAS_EMAIL:5}
      max-tentativas-ip: ${LOGIN_MAX_TENTATIVAS_IP:20}
      janela-segundos: ${LOGIN_JANELA_SEGUNDOS:900}
    dispositivo-sal: ${DEVICE_CREDENTIAL_SALT:}
  carga-inicial:
    maquina-codigo: TORNO-01
    admin-nome: ${ADMIN_NOME:Administrador}
    admin-email: ${ADMIN_EMAIL:}
    admin-senha: ${ADMIN_SENHA:}
    dispositivo-real: ps-torno-01
    chave-dispositivo-real: ${DISPOSITIVO_TORNO_CHAVE:}
    dispositivo-simulado: ps-sim-01
    chave-dispositivo-simulado: ${DISPOSITIVO_SIM_CHAVE:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha
