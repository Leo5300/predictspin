; Versões fixas da plataforma e das bibliotecas: a mesma compilação em qualquer máquina.
; Para atualizar, troque o número aqui, compile, rode os testes e registre no commit.
;
;   pio run                 compila para o ESP32
;   pio run -t upload       grava (com o ESP32 no USB)
;   pio test -e native      testes da lógica pura no computador (precisa de gcc/g++ no PATH)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 460800
; app de 3 MB e 896 KB de LittleFS para a fila; sem atualização pelo ar (OTA)
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
; pacote de certificados raiz para o HTTPS (ferramentas/gerar_pacote_certificados.py)
board_build.embed_files = data/cert/x509_crt_bundle.bin
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    olikraus/U8g2@2.36.18
    adafruit/Adafruit NeoPixel@1.15.5

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
; só a lógica pura de lib/ entra nos testes; src/ depende do Arduino
test_build_src = no
lib_ignore = U8g2, Adafruit NeoPixel
