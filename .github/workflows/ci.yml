name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build, testes e cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Os testes de integração sobem um PostgreSQL 16 com Testcontainers;
      # o Docker já vem instalado no executor ubuntu-latest.
      - name: Build, testes e meta de cobertura
        run: ./mvnw -B verify

      - name: Guarda o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: api/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Guarda os relatórios de teste em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-surefire
          path: api/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  analise:
    name: Análise (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: analise
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analise/requirements.txt

      - name: Dependências
        run: python -m pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q
