name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build, testes e cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Os testes de integração sobem um PostgreSQL 16 com Testcontainers;
      # o Docker já vem instalado no executor ubuntu-latest.
      - name: Build, testes e meta de cobertura
        run: ./mvnw -B verify

      - name: Guarda o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: api/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Guarda os relatórios de teste em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-surefire
          path: api/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  analise:
    name: Análise (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: analise
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analise/requirements.txt

      - name: Dependências
        run: python -m pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

  painel:
    name: Painel (lint, tipos, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: painel
    steps:
      - uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: painel/package-lock.json

      - name: Dependências
        run: npm ci

      - name: Lint (sem avisos)
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes (Vitest)
        run: npm test

      - name: Build de produção
        run: npm run build
        env:
          # endereço fictício só para o build da CI (a política de segurança é gerada com ele)
          VITE_API_URL: https://api.exemplo.invalid

      # Os testes de ponta a ponta (Playwright) precisam do compose com a API, o banco e o
      # simulador; não cabem com folga em 15 minutos aqui e rodam localmente (docs/painel.md).
